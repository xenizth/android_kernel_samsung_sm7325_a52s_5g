name: Build A52s Kernel

# Runs the repo's own build_kernel_zip.sh on GitHub Actions.
# Pick the branch you want to build in the "Use workflow from" box
# (e.g. ksu-next-oneui or ksu-next-susfs-oneui).
#
# KernelSU-Next is swapped at build time only, nothing is pushed:
#   - ksu_ref = v3.4.0-legacy (default) -> official KernelSU-Next legacy line
#   - if the branch name contains "susfs", .github/patches/susfs-on-3.4.0-legacy.patch
#     is applied on top (it ports the SUSFS support onto 3.4.0)
#   - ksu_ref = none -> keep the submodule exactly as pinned in the branch

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU-Next legacy tag/branch (v3.4.0-legacy, legacy). 'none' keeps the repo's own submodule"
        required: false
        default: "v3.4.0-legacy"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      # build_kernel_zip.sh refuses to run unless the folder has this exact name.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: android_kernel_samsung_sm7325_a52s_5g
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev libelf-dev zip unzip \
            xz-utils kmod lz4 python3 git curl dwarves rsync libncurses-dev \
            gcc-aarch64-linux-gnu

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: a52s-${{ github.ref_name }}
          max-size: 3G

      # Done at build time only: nothing is committed or pushed to your repo.
      - name: Update KernelSU-Next
        if: ${{ inputs.ksu_ref != 'none' }}
        shell: bash
        working-directory: android_kernel_samsung_sm7325_a52s_5g
        env:
          KSU_REF: ${{ inputs.ksu_ref || 'v3.4.0-legacy' }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PATCH="$PWD/.github/patches/susfs-on-3.4.0-legacy.patch"

          cd KernelSU-Next
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/KernelSU-Next/KernelSU-Next.git
          git fetch --no-tags upstream "+refs/heads/legacy:refs/remotes/upstream/legacy" "+refs/tags/${KSU_REF}:refs/tags/${KSU_REF}" 2>/dev/null \
            || git fetch --no-tags upstream "+refs/heads/legacy:refs/remotes/upstream/legacy"

          if git rev-parse -q --verify "refs/tags/${KSU_REF}" >/dev/null; then
            git checkout -q -f "refs/tags/${KSU_REF}"
            LABEL="$KSU_REF"
          elif git rev-parse -q --verify "refs/remotes/upstream/${KSU_REF}" >/dev/null; then
            git checkout -q -f "refs/remotes/upstream/${KSU_REF}"
            LABEL="legacy-$(git rev-parse --short HEAD)"
          else
            echo "::error::'${KSU_REF}' is not a tag or branch of KernelSU-Next (try v3.4.0-legacy or legacy)"
            exit 1
          fi

          SUSFS=0
          if [[ "$BRANCH_NAME" == *susfs* ]]; then
            SUSFS=1
            if [ ! -f "$PATCH" ]; then
              echo "::error::Branch '$BRANCH_NAME' has SUSFS but $PATCH is missing. Commit susfs-on-3.4.0-legacy.patch to .github/patches/"
              exit 1
            fi
            if ! git apply --check "$PATCH"; then
              echo "::error::SUSFS patch does not apply to KernelSU-Next '${KSU_REF}'. It was made for v3.4.0-legacy."
              exit 1
            fi
            git apply --whitespace=nowarn "$PATCH"
            echo "applied SUSFS patch"
          fi

          # The build script labels the zip with the last tag it finds, so leave exactly one.
          git tag -l | xargs -r git tag -d >/dev/null
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "ci: KernelSU-Next ${LABEL}$([ $SUSFS = 1 ] && echo ' + SUSFS')"
          git tag "$LABEL"
          cd ..

          # Stage the new submodule commit so build_kernel_zip.sh's
          # 'git submodule update' keeps it instead of resetting it.
          git add KernelSU-Next

          if [ "$SUSFS" = 1 ]; then
            # With 3.4.x the setuid hook is an LSM hook. The kernel's own call in
            # sys.c (old 3-argument form) would fire it a second time with the wrong
            # arguments, so remove that call.
            python3 - <<'PY'
          import re, sys
          p = "kernel/sys.c"
          s = open(p).read()
          pat = re.compile(r'#ifdef CONFIG_KSU_SUSFS\n\tif \(ksu_handle_setresuid\(ruid, euid, suid\)\) \{\n.*?\n\t\}\n#endif\n', re.S)
          s2, n = pat.subn('', s, count=1)
          if n:
              open(p, "w").write(s2)
              print("removed duplicate ksu_handle_setresuid call from kernel/sys.c")
          else:
              print("::warning::kernel/sys.c setresuid hook not found (already removed?)")
          PY
          fi

          echo "== KernelSU-Next in use =="
          git -C KernelSU-Next log -1 --format='%h %s'
          git -C KernelSU-Next tag -l

      - name: Build kernel zip
        shell: bash
        working-directory: android_kernel_samsung_sm7325_a52s_5g
        env:
          CCACHE_SLOPPINESS: time_macros,include_file_mtime
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          # The script downloads the same clang every run, so don't key on its file times.
          CCACHE_COMPILERCHECK: "string:aosp-clang-r530567"
        run: |
          git config --global --add safe.directory '*'
          # Make the script's kernel compile go through ccache (workflow-only, repo untouched).
          sed -i 's|^\([[:space:]]*\)CC=clang \\$|\1CC="ccache clang" \\|' build_kernel_zip.sh
          grep -n 'CC="ccache clang"' build_kernel_zip.sh || { echo "::warning::could not enable ccache (script layout changed), building without it"; }
          chmod +x build_kernel_zip.sh
          ./build_kernel_zip.sh

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Show KernelSU config
        if: always()
        working-directory: android_kernel_samsung_sm7325_a52s_5g
        run: |
          git -C KernelSU-Next log -1 --format='%h %s' || true
          grep -E "CONFIG_KSU" out/.config || echo "No CONFIG_KSU* options in out/.config"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: a52s-kernel-${{ github.sha }}
          path: android_kernel_samsung_sm7325_a52s_5g/*.zip
          if-no-files-found: warn
